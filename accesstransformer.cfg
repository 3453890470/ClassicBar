# Access Transformer 配置文件
# 此文件由 net.minecraftforge.accesstransformers 插件处理（仅开发环境生效）
# 用于修改第三方依赖（如其他 Mod）中类成员的可见性，避免使用 Mixin 反射。
#
# 语法格式：
#   <access> <fully-qualified-class-name> <member-type> <member-name>
#
# access 取值：public、protected、default（包内可见）、private
# member-type 取值：*（全部成员）、f（字段）、m（方法）、c（构造器）
#
# ========== 示例 ==========
#
# 将某个类的私有字段改为 public 访问
# public com.example.mod.ExampleClass f exampleField
#
# 将某个类的 protected 方法改为 public
# public com.example.mod.ExampleClass m exampleMethod
#
# 将某个类的默认访问权限字段改为 public
# public com.example.mod.ExampleClass f defaultField
#
# 将某个类的构造器改为 public
# public com.example.mod.ExampleClass c <init>
#
# ========== 本项目的示例条目（以下为占位，实际需要时请修改）==========
#
# 示例：将 Vampirism 中某个类的私有字段开放为 public 访问
# public de.teamlapen.vampirism.entity.player.VampirismPlayerAttributes f somePrivateField
