# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.daemon=false
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000

minecraft_version_range=[26.1.2]
loader_version_range=[1,)

mod_id=classicbar
mod_name=Classic Bar
mod_license=GPL-3.0-only
mod_group_id=com.tfar.classicbar

# 性能三件套
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 代理配置 (HTTP/HTTPS) — 如需使用请取消注释
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7897
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7897
# systemProp.http.nonProxyHosts=localhost|127.0.0.1
