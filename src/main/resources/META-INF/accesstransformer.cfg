# Access Transformer 配置示例
# 语法格式见：https://github.com/vfyjxf/CoremodTips/blob/master/AccessTransformForMod.md
#
# public: 将目标成员改为 public
# protected: 将目标成员改为 protected
# private: 将目标成员改为 private（慎用）
# 去掉修饰符（default/package-private）
#
# 用法（按优先级）：
#   类名     成员                 访问级别
#   net.example.mod.ExampleClass  fieldName      public
#   net.example.mod.ExampleClass  methodName()   public
#   net.example.mod.ExampleClass  methodName(Lnet/minecraft/world/entity/Player;)V  public

# 示例：将某个 mod 的私有字段改为可访问
# com.somemod.SomeClass  privateField  public
