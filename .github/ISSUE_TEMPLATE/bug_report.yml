name: Bug Report
description: Report a problem in Classic Bar
title: "[BUG] "
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        ClassicBar is a **NeoForge 1.21.1 pure client-side HUD mod**. Please make sure you have tested without other mods first to isolate the issue.

  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version
      description: ClassicBar only supports 1.21.1
      options:
        - 1.21.1
    validations:
      required: true

  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      placeholder: e.g. 21.1.0
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: ClassicBar version
      placeholder: e.g. 1.21.1-1.0.0
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other mods list
      description: |
        Please list other mods you have installed (especially HUD mods, health/armor display mods, or modpacks).
        Since ClassicBar is a client-side HUD mod, it may conflict with other mods that also modify the vanilla HUD.
      placeholder: |
        - Mod A (version X.X.X)
        - Mod B (version X.X.X)
        - ...

  - type: textarea
    id: description
    attributes:
      label: Expected behavior vs Actual behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: Expected the health bar to show correctly, but it's overlapping with ...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install ClassicBar and ...
        2. Launch Minecraft and ...
        3. Look at HUD and ...
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: |
        Please attach or link any relevant logs (`latest.log`, `debug.log`) and/or screenshots.
        Use a paste site such as [pastebin](https://pastebin.com/) for long logs.
      placeholder: Drag & drop screenshots, or paste log links here.

  - type: dropdown
    id: shaders
    attributes:
      label: Are you using shaders / resource packs?
      options:
        - "No"
        - "Yes (shaders)"
        - "Yes (resource pack)"
        - "Yes (both)"

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Any other relevant context, such as operating system, vanilla vs modpack, etc.
