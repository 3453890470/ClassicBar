plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'Vampirism'
        url = "https://maven.maxanier.de/releases"
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com"
    }
}

def resourceProperties = [
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neo_version,
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : project.mod_version,
        mod_group_id           : project.mod_group_id,
        project_version        : project.version,
]

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // TASK-04 compat quarantine: keep legacy mod overlays outside active compile.
            // The compat/ package is no longer quarantined — farmersdelight and kaleidoscope_cookery support are now active.
            // Each remaining integration stays isolated until a separate recovery task proves the NeoForge port.
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // === Optional mod compatibility ===

    // 农夫乐事 (Farmer's Delight)
    compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.1"
    runtimeOnly "maven.modrinth:farmers-delight:1.21.1-1.3.1"

    // 森罗物语 (Kaleidoscope Cookery)
    compileOnly "maven.modrinth:kaleidoscope-cookery:1.3.0-neoforge+mc1.21.1"
    runtimeOnly "maven.modrinth:kaleidoscope-cookery:1.3.0-neoforge+mc1.21.1"

    // 血族 (Vampirism)
    // compileOnly uses :api classifier to avoid pulling implementation classes
    compileOnly "de.teamlapen.vampirism:Vampirism:1.21-${vampirism_version}:api"
    runtimeOnly("de.teamlapen.vampirism:Vampirism:1.21-${vampirism_version}") {
        exclude group: 'com.github.glitchfiend', module: 'TerraBlender-neoforge'
    }

    // 神秘遗物+ (Enigmatic Legacy+)
    // Modrinth 项目 ID oIjj1Fan（避免 slug 中 + 号的 Maven 解析问题）
    compileOnly "maven.modrinth:oIjj1Fan:ErPhQo57"
    runtimeOnly "maven.modrinth:oIjj1Fan:ErPhQo57"

    // 口渴 (Thirst Was Taken)
    compileOnly "maven.modrinth:iUheEnjm:YqPoqXIx"
    runtimeOnly "maven.modrinth:iUheEnjm:YqPoqXIx"

    // 意志坚定 (Tough As Nails) — 临时禁用，仅编译期
    compileOnly "maven.modrinth:ge1sOdFH:mboAbksk"

    // === 前置模组（由神秘遗物+ 自动传递，仅开发运行需要）===
    runtimeOnly "maven.modrinth:curios:yohfFbgD"
    runtimeOnly "maven.modrinth:caelus:KsfI4QsR"
    runtimeOnly "maven.modrinth:patchouli:BIogJv2D"

    // === End optional mod compatibility ===
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'classicbar.projectDir', project.projectDir.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(resourceProperties)
    }
}
