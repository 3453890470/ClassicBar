plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

def resourceProperties = [
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neo_version,
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : project.mod_version,
        mod_group_id           : project.mod_group_id,
        project_version        : project.version,
]

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // TASK-04 compat quarantine: keep legacy third-party compat outside active compile.
            // Each integration stays isolated until a separate recovery task proves the NeoForge port.
            exclude 'tfar/classicbar/compat/**'
            exclude 'tfar/classicbar/impl/overlays/mod/**'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'classicbar.projectDir', project.projectDir.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(resourceProperties)
    }
}
