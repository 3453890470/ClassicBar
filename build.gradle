plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${project.minecraft_version}-${project.mod_version}"
group = project.mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'Vampirism'
        url = "https://maven.maxanier.de/releases"
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com"
    }
}

def resourceProperties = [
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neo_version,
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : project.mod_version,
        mod_group_id           : project.mod_group_id,
        project_version        : project.version,
]

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            // TASK-04 compat quarantine: keep legacy mod overlays outside active compile.
            // The compat/ package is no longer quarantined — farmersdelight and kaleidoscope_cookery support are now active.
            // Each remaining integration stays isolated until a separate recovery task proves the NeoForge port.
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // 模组兼容 - 编译期依赖
    compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.1"
    compileOnly "maven.modrinth:kaleidoscope-cookery:1.3.0-neoforge+mc1.21.1"
    compileOnly "de.teamlapen.vampirism:Vampirism:1.21-${vampirism_version}:api"

    // 开发运行客户端时自动加载（localRuntime 仅开发环境生效，不传播到发布产物）
    runtimeOnly "maven.modrinth:farmers-delight:1.21.1-1.3.1"
    runtimeOnly "maven.modrinth:kaleidoscope-cookery:1.3.0-neoforge+mc1.21.1"
    runtimeOnly("de.teamlapen.vampirism:Vampirism:1.21-${vampirism_version}") {
        exclude group: 'com.github.glitchfiend', module: 'TerraBlender-neoforge'
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'classicbar.projectDir', project.projectDir.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(resourceProperties)
    }
}
