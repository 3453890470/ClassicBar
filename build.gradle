plugins {
    id 'java-library'
    alias libs.plugins.neoforge.moddev
    alias libs.plugins.accesstransformers
    id 'com.diffplug.spotless' version '7.0.3'
}

version = "${libs.versions.minecraft.get()}-${libs.versions.mod.version.get()}"
group = project.mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = 'Vampirism'
        url = "https://maven.maxanier.de/releases"
    }
    maven {
        name = "JEI"
        url = "https://maven.blamejared.com"
    }
}

def resourceProperties = [
        minecraft_version      : libs.versions.minecraft.get(),
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : libs.versions.neo.version.get(),
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : libs.versions.mod.version.get(),
        mod_group_id           : project.mod_group_id,
        project_version        : project.version,
]

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
        java {
            // TASK-04 compat quarantine: keep legacy mod overlays outside active compile.
            // The compat/ package is no longer quarantined — farmersdelight and kaleidoscope_cookery support are now active.
            // Each remaining integration stays isolated until a separate recovery task proves the NeoForge port.
        }
    }
}

neoForge {
    version = libs.versions.neo.version.get()

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter

    // === Optional mod compatibility ===

    // 农夫乐事 (Farmer's Delight)
    compileOnly libs.farmers.delight
    runtimeOnly libs.farmers.delight

    // 森罗物语 (Kaleidoscope Cookery)
    compileOnly libs.kaleidoscope.cookery
    runtimeOnly libs.kaleidoscope.cookery

    // 血族 (Vampirism)
    // compileOnly uses :api classifier to avoid pulling implementation classes
    compileOnly "de.teamlapen.vampirism:Vampirism:${libs.versions.vampirism.get()}:api"
    runtimeOnly(libs.vampirism.core) {
        exclude group: 'com.github.glitchfiend', module: 'TerraBlender-neoforge'
    }

    // 神秘遗物+ (Enigmatic Legacy+)
    // Modrinth 项目 ID oIjj1Fan（避免 slug 中 + 号的 Maven 解析问题）
    compileOnly libs.enigmaticlegacyplus
    runtimeOnly libs.enigmaticlegacyplus

    // 口渴 (Thirst Was Taken)
    compileOnly libs.thirst.was.taken
    runtimeOnly libs.thirst.was.taken

    // 意志坚定 (Tough As Nails) — 临时禁用，仅编译期
    compileOnly libs.tough.as.nails

    // === 前置模组（由神秘遗物+ 自动传递，仅开发运行需要）===
    runtimeOnly libs.curios
    runtimeOnly libs.caelus
    runtimeOnly libs.patchouli

    // === End optional mod compatibility ===
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'classicbar.projectDir', project.projectDir.absolutePath
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(resourceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(resourceProperties)
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.28.0')
        trimTrailingWhitespace()
        removeUnusedImports()
        endWithNewline()
    }
}
